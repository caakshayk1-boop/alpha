name: engines
# Swing v2 after the Indian close: the market gate, new signals under the book limits, every open trade walked through the plan; publishes public/signals.json (and engines.json for the alerts) and the
# registry, then triggers a deploy. A push made with GITHUB_TOKEN does not start other workflows, so the deploy is
# dispatched explicitly.
on:
  schedule:
    - cron: '30 12 * * 1-5'      # 18:00 IST, after Yahoo has settled the day
    - cron: '30 14 * * 1-5'      # 20:00 IST, retry if the first slot was dropped; the registry makes it idempotent
    - cron: '0 17 * * 1-5'       # 22:30 IST, re-marks every trade once Yahoo has the late bars (19 Oct 2026: most arrived after 18:00)
  workflow_dispatch:
concurrency:
  group: engines
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engines/requirements.txt
      - run: pip install -r engines/requirements.txt
      - name: Engine tests
        working-directory: engines
        run: |
          python tests/test_swing.py
          python tests/test_integrity.py
          python tests/test_registry.py
      # Swing v2 since 21 Oct 2026 (engines/swing.py). The five ML engines (ai_run_daily.py) are retired; their registry
      # and last feed are in engines/archive/ml-2026-10-21/ and nothing reads them.
      - name: Market gate, new signals, track open trades
        working-directory: engines
        run: python swing_run.py
      - name: Commit results
        run: |
          git config user.name  "caakshayk1-boop"
          git config user.email "caakshayk1-boop@users.noreply.github.com"
          git add public/signals.json public/engines.json public/rotation.json engines/state/swing_registry.json
          git diff --staged --quiet && echo "unchanged" && exit 0
          git commit -m "data: engines $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash && sleep 3
          done
          exit 1
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}"
