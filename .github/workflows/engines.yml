name: engines
# Refreshes the four engines after the Indian close, tracks every open trade, publishes public/engines.json and the
# registry, then triggers a deploy. A push made with GITHUB_TOKEN does not start other workflows, so the deploy is
# dispatched explicitly.
on:
  schedule:
    - cron: '30 12 * * 1-5'      # 18:00 IST, after Yahoo has settled the day
    - cron: '30 14 * * 1-5'      # 20:00 IST, retry if the first slot was dropped; the registry makes it idempotent
  workflow_dispatch:
concurrency:
  group: engines
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engines/requirements.txt
      - run: pip install -r engines/requirements.txt
      - name: Engine tests
        working-directory: engines
        run: |
          python tests/test_engines.py
          python tests/test_registry.py
      - name: Refresh signals and track open trades
        working-directory: engines
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name  "caakshayk1-boop"
          git config user.email "caakshayk1-boop@users.noreply.github.com"
          git add public/engines.json engines/state/registry.json
          git diff --staged --quiet && echo "unchanged" && exit 0
          git commit -m "data: engines $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash && sleep 3
          done
          exit 1
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}"
