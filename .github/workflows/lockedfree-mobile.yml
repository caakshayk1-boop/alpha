name: lockedfree-mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/lockedfree/mobile/**', '.github/workflows/lockedfree-mobile.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lockedfree/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci && npx cap sync android
      - run: cd android && ./gradlew --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: rulebook-android-unsigned
          path: apps/lockedfree/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
