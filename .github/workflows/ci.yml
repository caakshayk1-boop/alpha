name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      # next/font downloads the faces at build time, so this step needs the network.
      - run: npm run build
      - name: Audit links, feeds and endpoints
        run: node scripts/audit.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engines/requirements.txt
      - run: pip install -r engines/requirements.txt
      - name: Engine tests (no-lookahead features and labels, embargo, trade layer, registry)
        working-directory: engines
        run: |
          python tests/test_ai.py
          python tests/test_registry.py
      - name: Static export has every page
        run: |
          for p in index brief/index markets/index screen/index company/index map/index engines/index magic/index reads/index ipo/index funds/index news/index about/index tools/index compare/index calendar/index watchlist/index; do
            test -f "out/$p.html" || { echo "::error::out/$p.html missing"; exit 1; }
          done
          test -f out/_headers
