name: tripwire-research
# The factor study behind the Tripwire engines (apps/tripwire/research/study.py). Research only: it reads public prices through yfinance and
# writes a report; nothing is published to a site and nothing is sent. Runs the harness tests first (indicator maths, a random walk that must
# adopt nothing, a planted effect that must be found). Triggered by [tw-research] in a pushed commit message on a non-main branch, or by dispatch.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
concurrency:
  group: tripwire-research-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tw-research]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: engines/requirements.txt }
      - run: pip install -r engines/requirements.txt
      - run: npm ci
      - name: Harness tests (must pass before any real data is read)
        run: python apps/tripwire/research/test_research.py
      - name: Fetch the published screen
        run: node scripts/shard.mjs && node apps/tripwire/build.mjs
      - name: The study
        working-directory: apps/tripwire/research
        run: python study.py ../dist/data/screen.json results
      - name: The engines, back-tested as built
        working-directory: apps/tripwire/research
        run: python engines_backtest.py ../dist/data/screen.json results
      - name: Momentum walk-forward (the as-built rule and its pre-declared family, every year out of sample)
        working-directory: apps/tripwire/research
        run: python engines_walkforward.py ../dist/data/screen.json results
      - name: Commit the report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/tripwire/research/results
          git diff --cached --quiet && echo unchanged && exit 0
          git commit -m "research: tripwire factor study $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git pull --rebase origin "${GITHUB_REF_NAME}"; done; exit 1
