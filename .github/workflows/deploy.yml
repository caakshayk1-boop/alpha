name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # The data repo builds the screen at about 02:40 IST, after the 18:50 IST deploy that follows the engines job, so company
  # pages (pre-rendered from public/c/*.json) would show the previous session until the next deploy. Redeploy after it:
  # 02:00 UTC = 07:30 IST, and a 04:00 UTC (09:30 IST) catch-up because GitHub silently drops scheduled runs. Mon-Sat: the
  # Saturday run picks up Friday's overnight screen. A schedule always runs on the default branch (main).
  schedule:
    - cron: '0 2 * * 1-6'
    - cron: '0 4 * * 1-6'
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Only after CI is green on main, by hand, or on the morning schedule (guarded by the green-CI step below).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read      # the scheduled run reads the last CI result
    steps:
      # A deploy that silently skips because a secret is missing looks exactly like a deploy that worked.
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets. Nothing was deployed."
            exit 1
          fi
      # A scheduled run deploys the tip of main, which can hold a commit CI rejected. Data commits from the engines job carry
      # [skip ci] and are already deployed by that job's own dispatch, so the rule is: the newest finished CI run on main must
      # be green. If it is not, fail loudly rather than ship what CI refused.
      - name: Require green CI on main (scheduled runs)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          echo "newest finished CI run on main: $last"
          if [ "$last" != "success" ]; then
            echo "::error::The newest finished CI run on main is '$last', not green. Scheduled deploy refused."
            exit 1
          fi
      # workflow_run: the commit CI passed. schedule and workflow_dispatch: github.sha, the tip of main (a schedule only ever
      # runs on the default branch).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test production
        run: |
          sleep 15
          node scripts/smoke.mjs https://alpha.askakshay.com
