name: tripwire-ledger
# The forward record of the three Tripwire engines. Runs after the screen has been published (see WHEN below), writes down every
# pick once per data day, and replays unfinished picks against real daily bars. Paper only: nothing is sent and nothing is published to a site.
# A run that cannot fetch most of its prices fails (red), so a blind night is visible. The commit is [skip ci]; the app reads the file live
# through its /api/ledger route, so no deploy is needed.
on:
  repository_dispatch:
    types: [screen-published]
  workflow_dispatch:
  schedule:
    # Recovery slots only. The source publisher triggers screen-published after
    # every successful same-evening publication; a repeated data day is a no-op.
    - cron: '45 1 * * 2-6'       # 07:15 IST, before the 09:15 IST open
    - cron: '15 3 * * 2-6'       # 08:45 IST, a retry
concurrency:
  group: tripwire-ledger
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tripwire:test
      - name: Fetch the published screen
        run: node scripts/shard.mjs
      - run: npm run tripwire:build
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: engines/requirements.txt }
      - run: pip install -r engines/requirements.txt
      - run: python apps/tripwire/ledger/test_bars.py
      - name: Write down tonight's picks
        run: node --experimental-strip-types apps/tripwire/ledger/record.ts record
      - name: Fetch daily bars (yfinance)
        run: python apps/tripwire/ledger/bars.py
        continue-on-error: true
      - name: Factor sheet (the less common indicators, with the study's verdicts)
        id: factors
        working-directory: apps/tripwire/research
        run: python factors.py ../dist/data/screen.json ../ledger/factors.json results/factor_study.json
        continue-on-error: true
      - name: RSI on daily, weekly and monthly closes (read by Discover and the company page)
        id: rsi
        working-directory: apps/tripwire/research
        run: python rsi_multi.py ../dist/data/screen.json ../ledger/rsi.json
        continue-on-error: true
      - name: FII and DII flows (NSE, provisional)
        id: fiidii
        run: node --experimental-strip-types apps/tripwire/tools/fiidii.mjs
        continue-on-error: true      # a blocked or changed NSE endpoint must not redden the picks job; the Markets card hides itself when its newest day is old
      - name: Replay unfinished picks
        id: rec
        run: node --experimental-strip-types apps/tripwire/ledger/record.ts evaluate
        continue-on-error: true
      - name: Commit the ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/tripwire/ledger/ledger.json
          [ -f apps/tripwire/ledger/factors.json ] && git add apps/tripwire/ledger/factors.json
          [ -f apps/tripwire/ledger/rsi.json ] && git add apps/tripwire/ledger/rsi.json
          [ -f apps/tripwire/ledger/fiidii.json ] && git add apps/tripwire/ledger/fiidii.json
          git diff --cached --quiet && echo unchanged && exit 0
          git commit -m "paper: tripwire ledger $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase origin main; [ "$i" = 3 ] && exit 1; done
      - name: Report an incomplete price or research refresh
        if: steps.rec.outcome == 'failure' || steps.factors.outcome == 'failure' || steps.rsi.outcome == 'failure'
        run: |
          echo "::error::The price replay or a research sheet could not refresh. Successful outputs were committed; rejected sheets kept their last good copy. Check the failed step above."
          exit 1
