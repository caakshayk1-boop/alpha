name: Tempo release checks
on:
  push:
    paths: ['apps/tempo/**', 'wrangler.tempo.jsonc', '.github/workflows/tempo.yml']
  pull_request:
    paths: ['apps/tempo/**', 'wrangler.tempo.jsonc', '.github/workflows/tempo.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run tempo:test
      - run: npm run tempo:check
