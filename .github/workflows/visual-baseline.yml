name: visual-baseline
# Renders the visual-regression baselines on the SAME runner image and browser that CI compares against, and commits them
# to the branch it was dispatched on. Baselines rendered anywhere else differ by 0.4-1.9% of pixels on every route (text
# rasterisation), which no honest tolerance can absorb. It runs only for a pushed commit whose message carries
# [approve-visual] (or by dispatch once this file is on main), and the PNGs it commits are reviewed before merging.
# A GITHUB_TOKEN push starts no workflow, so CI re-runs on the next push to the branch.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[approve-visual]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Render and approve the baselines
        run: node scripts/visual.mjs --update
      - name: Commit the baselines if they changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/baseline
          if git diff --cached --quiet; then echo 'baselines unchanged'; exit 0; fi
          git commit -m "Visual baselines rendered on the CI image (ubuntu-24.04, Playwright Chromium)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
