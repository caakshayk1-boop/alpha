name: tripwire
on:
  pull_request:
    paths: ['apps/tripwire/**', 'wrangler.tripwire.jsonc', '.github/workflows/tripwire.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the Tripwire Worker (owner decision; choose the address first, see docs/tripwire/README.md)'
        type: boolean
        default: false
  # The app's data is a snapshot taken at build time, so it goes a day stale unless it is rebuilt. The website's screen is built at 21:00 IST
  # (retry 23:00 IST); these runs build and deploy after it. They run every check first, and a failing check stops the deploy.
  # A schedule only runs on the default branch. Remove these two lines to make deploys manual again.
  schedule:
    - cron: '15 18 * * 1-6'      # 23:45 IST, Monday to Saturday
    - cron: '45 22 * * 1-6'      # 04:15 IST, a catch-up if the first run found no new data
concurrency:
  group: tripwire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tripwire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: engines/requirements.txt }
      - run: pip install -r engines/requirements.txt
      - name: Research harness and ledger tests (indicator maths, a random walk adopts nothing, a planted effect is found)
        run: |
          python apps/tripwire/research/test_research.py
          python apps/tripwire/ledger/test_bars.py
      - run: npx playwright install --with-deps chromium
      - run: npm run tripwire:types
      - run: npm run tripwire:test
      - name: Fetch the published company data (the same step the website's build runs)
        run: node scripts/shard.mjs
      - run: npm run tripwire:build
      - run: npm run tripwire:check
      - name: Deploy (manual, or the scheduled refresh on main)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Cloudflare secrets missing. Nothing was deployed."; exit 1; fi
          npx wrangler deploy --config wrangler.tripwire.jsonc
