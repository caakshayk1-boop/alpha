name: tripwire
on:
  repository_dispatch:
    types: [screen-published]
  pull_request:
    paths: ['apps/tripwire/**', 'wrangler.tripwire.jsonc', '.github/workflows/tripwire.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the Tripwire Worker (owner decision; choose the address first, see docs/tripwire/README.md)'
        type: boolean
        default: false
  # The screen publisher dispatches immediately after its validated commit.
  # These morning slots remain recovery paths if that event/token fails.
  schedule:
    - cron: '15 2 * * 2-6'       # 07:45 IST, Tuesday to Saturday
    - cron: '45 3 * * 2-6'       # 09:15 IST, a retry
concurrency:
  group: tripwire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tripwire:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: engines/requirements.txt }
      - run: pip install -r engines/requirements.txt
      - name: Research harness and ledger tests (indicator maths, a random walk adopts nothing, a planted effect is found)
        run: |
          python apps/tripwire/research/test_research.py
          python apps/tripwire/ledger/test_bars.py
      - run: npx playwright install --with-deps chromium
      - run: npm run tripwire:types
      - run: npm run tripwire:test
      - name: Fetch the published company data (the same step the website's build runs)
        run: node scripts/shard.mjs
      - run: npm run tripwire:build
      - name: Freshness and completeness assertions (screen = last completed NSE session, no stale or sector-less rows; see apps/tripwire/tools/check-data.mjs)
        if: ${{ github.event_name != 'pull_request' }}   # a data-freshness gate belongs to the build that publishes data; a pull request is not stopped because last night's screen build ran late
        run: npm run tripwire:verify-data
      - name: Performance budget (initial JS <= 250 KB gzip, no render-blocking CSS, modulepreload, lazy heavy views; see apps/tripwire/tools/budget.mjs)
        run: npm run tripwire:budget
      # The browser gate drives a real page against mocks and has failed on a slow runner with nothing wrong (run 40433652756: a 15 s wait for a live dot, and an immediate read of a summary).
      # A scheduled run gets ONE more attempt before it gives up, because a flaky gate otherwise leaves the site on yesterday's data. Pull requests and manual runs fail on the first failure, as before.
      - name: Browser gate
        id: gate
        run: npm run tripwire:check
        continue-on-error: ${{ github.event_name == 'schedule' }}
      - name: Browser gate, second attempt (scheduled runs only)
        if: ${{ github.event_name == 'schedule' && steps.gate.outcome == 'failure' }}
        run: npm run tripwire:check
      - name: Is this data day already on the site? (the retry slot only)
        id: already
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '45 3 * * 2-6' }}
        run: |
          built=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/tripwire/dist/data/screen.json','utf8')).as_of)")
          live=$(curl -fsS --max-time 30 https://tripwire.askakshay.com/data/screen.json | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{try{console.log(JSON.parse(t).as_of)}catch{console.log('unknown')}})" || echo unknown)
          echo "built=$built live=$live"
          if [ "$built" = "$live" ]; then echo 'same=true' >> "$GITHUB_OUTPUT"; echo "The site already carries data through $built; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Deploy (manual, or the scheduled refresh on main)
        if: ${{ steps.already.outputs.same != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || ((github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main')) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Cloudflare secrets missing. Nothing was deployed."; exit 1; fi
          npx wrangler deploy --config wrangler.tripwire.jsonc
