name: lockedfree
# Build, test and (from main only) deploy Rulebook to lockedfree.askakshay.com. The ledger is baked in at build time, so a deploy follows every ledger commit.
on:
  pull_request:
    paths: ['apps/lockedfree/**', 'wrangler.lockedfree.jsonc', '.github/workflows/lockedfree*.yml']
  push:
    branches: [main]
    paths: ['apps/lockedfree/**', 'wrangler.lockedfree.jsonc', '.github/workflows/lockedfree.yml']
  workflow_run:
    workflows: [lockedfree-ledger, lockedfree-screens]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lockedfree-deploy
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/lockedfree
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npx astro build
      - run: node tools/assert-no-demo.mjs dist
      - run: node tools/copy-audit.mjs dist
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' || github.event_name == 'workflow_run'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.lockedfree.jsonc
      - name: Live check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' || github.event_name == 'workflow_run'
        run: |
          sleep 15
          curl -fsS https://lockedfree.askakshay.com/ | grep -q "Rulebook"
          curl -fsSI https://lockedfree.askakshay.com/ | grep -qi "content-security-policy"
          curl -fsS https://lockedfree.askakshay.com/api/health | grep -q '"ok":true'
