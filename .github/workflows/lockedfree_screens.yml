name: lockedfree-screens
# Weekly: fetch fundamentals, run the four screens, fetch bars, rebuild the ledger, commit. Friday 18:30 IST, after the close.
# Any gate failing (too few usable statements, a screen mostly not scorable, stale benchmark, history rewrite) writes nothing and goes red. A blind week is never published as a sit-out.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 5'
concurrency:
  group: lockedfree-ledger
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test apps/lockedfree/tests/*.test.ts
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance pandas
      - run: python apps/lockedfree/tools/fetch_fundamentals.py
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning apps/lockedfree/tools/run-screens.ts
        working-directory: apps/lockedfree
      - run: python apps/lockedfree/tools/fetch_bars.py
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning apps/lockedfree/tools/build-ledger.ts
      - name: Commit the week
        run: |
          git config user.name "rulebook-ledger" && git config user.email "actions@users.noreply.github.com"
          git add apps/lockedfree/ledger
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "ledger: rulebook weekly run $(date -u +%F) [skip ci]" && git push
