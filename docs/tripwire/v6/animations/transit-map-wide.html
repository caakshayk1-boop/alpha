<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920">
<title>Tripwire — From the close to the ledger (Transit Map, 16:9)</title>
<style>
/* Transit Map style, landscape 1920x1080 for the website. Flat colour, one bold line, round stations, tidy labels. Facts only: nothing here predicts. */
:root{--paper:#F4F1EA;--ink:#14171C;--line:#0B84F3;--line2:#E8532B;--dim:#5E6570}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.top{position:absolute;left:120px;top:96px}
.k{font-size:28px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
h1{font-size:104px;line-height:1.02;letter-spacing:-.035em;margin-top:18px;font-weight:800}
.sub{margin-top:22px;font-size:38px;color:var(--dim);line-height:1.3}
.tag{position:absolute;right:120px;top:104px;padding:12px 24px;border:3px solid var(--ink);border-radius:999px;font-size:26px;font-weight:700;letter-spacing:.1em}
svg{position:absolute;left:0;top:-90px;width:1920px;height:1080px}
.rail{fill:none;stroke:var(--line);stroke-width:20;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 8s cubic-bezier(.45,.05,.2,1) .8s forwards}
.spur{fill:none;stroke:var(--line2);stroke-width:20;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.2s ease-out 9.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.st{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
.st circle{fill:var(--paper);stroke:var(--ink);stroke-width:10}
.lbl{opacity:0;animation:fade .55s ease-out forwards;fill:var(--ink)}
.lbl .t{font-size:46px;font-weight:700;letter-spacing:-.01em}
.lbl .d{font-size:30px;font-weight:500;fill:var(--dim)}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.train{fill:var(--ink)}
.end{position:absolute;left:120px;right:120px;bottom:70px;opacity:0;animation:up .8s ease-out 11s forwards;font-size:32px;color:var(--dim);line-height:1.4}
.end b{color:var(--ink);font-size:36px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
<div class="tag">PAPER ONLY</div>
<div class="top"><div class="k">Tripwire · line 1</div><h1>From the close to the ledger</h1><div class="sub">One line. Six stops. Every stop leaves a dated record.</div></div>
<svg viewBox="0 0 1920 1080" aria-label="A transit line with six stations: Close, Screen, Rules, Picks, Paper book, Ledger">
  <path id="route" class="rail" d="M200 640 H800 C960 640 960 740 1120 740 H1700"/>
  <path class="spur" d="M1700 740 H1840"/>
  <g id="stations"></g>
  <circle class="train" r="22"><animateMotion dur="8s" begin="0.8s" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 .05 .2 1"><mpath href="#route"/></animateMotion></circle>
</svg>
<div class="end"><b>Public rules. Evidence for and against. Costs counted.</b> The ledger is append-only. Not advice.</div>
<script>
const NS='http://www.w3.org/2000/svg',g=document.getElementById('stations');
// x, y, title, detail, delay s, label above (true) or below
const S=[[200,640,'Close','NSE session ends',1.1,true],[500,640,'Screen','Every liquid name, scored',2.3,false],[800,640,'Rules','One written definition each',3.5,true],[1120,740,'Picks','What fired, with the evidence',4.8,false],[1420,740,'Paper book','Positions, exits, costs',6.2,true],[1700,740,'Ledger','Append-only. Dated.',7.8,false]];
for(const [x,y,t,d,s,above] of S){
  const c=document.createElementNS(NS,'g');c.setAttribute('class','st');c.style.animationDelay=s+'s';
  const k=document.createElementNS(NS,'circle');k.setAttribute('cx',x);k.setAttribute('cy',y);k.setAttribute('r',26);c.appendChild(k);g.appendChild(c);
  const l=document.createElementNS(NS,'text');l.setAttribute('class','lbl');l.style.animationDelay=(s+.15)+'s';l.setAttribute('text-anchor','middle');
  const ty=above?y-80:y+84, dy=above?y-42:y+124;
  l.innerHTML='<tspan class="t" x="'+x+'" y="'+ty+'">'+t+'</tspan><tspan class="d" x="'+x+'" y="'+dy+'">'+d+'</tspan>';g.appendChild(l);
}
setTimeout(()=>{window.__done=true},13500);
</script></body></html>
